apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config
  namespace: llmd-qwen3-prod
data:
  endpoint-picker-config.yaml: |
    apiVersion: config.llm-d.io/v1alpha1
    kind: EndpointPickerConfig
    metadata:
      name: epp-config
      namespace: llmd-qwen3-prod
    scheduling:
      filters:
        - name: prefix-cache-affinity-filter
          parameters:
            sessionAffinityHeaders:
              - X-Session-ID
              - X-Correlation-ID
        - name: utilization-filter
      scorers:
        - name: prefix-cache-scorer
          weight: 100
        - name: token-load-scorer
          weight: 50
          parameters:
            peakPrefillThroughput: 18500
        - name: active-request-scorer
          weight: 20
        - name: kv-cache-utilization-scorer
          weight: 30
      picker:
        name: max-score-picker
    flowControl:
      saturationDetector:
        name: utilization-detector
        parameters:
          threshold: 0.95
      admitter:
        name: probabilistic-admitter
        parameters:
          power: 2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-epp
  namespace: llmd-qwen3-prod
  labels:
    app: llm-d-epp
    llm-d.ai/component: epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-epp
  template:
    metadata:
      labels:
        app: llm-d-epp
        llm-d.ai/component: epp
    spec:
      containers:
      - name: epp
        image: ghcr.io/llm-d/llm-d-inference-scheduler:latest
        args:
        - --pool-name
        - llm-d-pool
        - --pool-namespace
        - llmd-qwen3-prod
        - --config-file
        - /etc/epp/endpoint-picker-config.yaml
        - --grpc-port
        - '9002'
        - --grpc-health-port
        - '9003'
        env:
        - name: SESSION_AFFINITY_HEADERS
          value: X-Session-ID,X-Correlation-ID
        ports:
        - name: grpc
          containerPort: 9002
        - name: health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: epp-config-vol
          mountPath: /etc/epp
          readOnly: true
      volumes:
      - name: epp-config-vol
        configMap:
          name: epp-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-epp
  namespace: llmd-qwen3-prod
  labels:
    app: llm-d-epp
    llm-d.ai/component: epp
spec:
  selector:
    app: llm-d-epp
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
  - name: metrics
    port: 9090
    targetPort: 9090
