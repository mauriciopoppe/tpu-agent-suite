apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-workers
  namespace: dynamo-qwen3-prod
  labels:
    app: dynamo-worker
    ai.dynamo/component: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: dynamo-worker
      ai.dynamo/component: worker
  template:
    metadata:
      labels:
        app: dynamo-worker
        ai.dynamo/component: worker
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
        cloud.google.com/gke-nodepool: a3-highgpu-8g
      containers:
        - name: worker
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - Qwen/Qwen3-32B
            - --tensor-parallel-size
            - "2"
            - --max-model-len
            - "32768"
            - --enable-prefix-caching
            - --gpu-memory-utilization
            - "0.92"
            - --kv-events-config
            - '{"enable_kv_cache_events":true,"publisher":"zmq"}'
          env:
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: UCX_TLS
              value: rc,cuda_copy
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "2"
            requests:
              nvidia.com/gpu: "2"
